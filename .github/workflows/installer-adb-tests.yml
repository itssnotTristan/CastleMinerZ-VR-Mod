name: Installer ADB regression
on:
  push:
    paths: ['QuestSetup/*.ps1', 'tests/**', '.github/workflows/installer-adb-tests.yml']
  pull_request:
    paths: ['QuestSetup/*.ps1', 'tests/**', '.github/workflows/installer-adb-tests.yml']
permissions:
  contents: read
jobs:
  adb-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile inert ADB double in a path containing spaces
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'cmz adb tests'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $source=Join-Path $env:GITHUB_WORKSPACE 'tests\AdbStub.cs'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /r:System.Web.Extensions.dll "/out:$dir\adb-stub.exe" $source
          if($LASTEXITCODE -ne 0){throw 'Stub compilation failed'}
      - name: Windows PowerShell 5.1 native stdout, stderr and argv
        shell: powershell
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'cmz adb tests'
          & ./tests/Test-AdbArguments.ps1 -Stub "$dir\adb-stub.exe" -Log "$dir\ps5.jsonl"
      - name: PowerShell 7 native stdout, stderr and argv
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'cmz adb tests'
          & ./tests/Test-AdbArguments.ps1 -Stub "$dir\adb-stub.exe" -Log "$dir\ps7.jsonl"
      - name: Manifest directory safety under both shells
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-QuestTransferPaths.ps1
          if($LASTEXITCODE -ne 0){throw 'PS5 transfer paths failed'}
          & ./tests/Test-QuestTransferPaths.ps1
      - name: Real installed ADB against isolated sync protocol fixture
        shell: pwsh
        run: |
          $adb=Join-Path $env:ANDROID_HOME 'platform-tools\adb.exe'
          if(-not (Test-Path -LiteralPath $adb)){throw 'Runner trusted Android platform-tools missing'}
          & $adb version
          python tests/test_quest_transfer.py --adb "$adb" --ps "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" --work "$env:RUNNER_TEMP\transfer5"
          if($LASTEXITCODE -ne 0){throw 'PS5 real ADB transfer protocol tests failed'}
          python tests/test_quest_transfer.py --adb "$adb" --ps (Get-Command pwsh).Source --work "$env:RUNNER_TEMP\transfer7"
          if($LASTEXITCODE -ne 0){throw 'PS7 real ADB transfer protocol tests failed'}
